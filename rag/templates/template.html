<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ficha Técnica - $Modelo</title>
    <!--
      Plantilla de la ficha técnica PDF (app/pdfdatagen.py, xhtml2pdf).
      Variables: $Modelo $Nombre $Categoria $Color_Acento $Fecha $Tabla_Especificaciones
                 $Ruta_Logo $Ruta_Foto $Foto_W $Foto_H $Logo_H $Bloque_Vista_Explosionada
      xhtml2pdf NO soporta max-width / max-height ni @bottom-left/right: las imágenes
      llevan width/height calculados por el generador y el pie de página es un @frame.
    -->
    <style>
        @page {
            size: letter;
            margin: 1.5cm 1.5cm 2.2cm 1.5cm;
            @frame footer {
                -pdf-frame-content: pie;
                left: 1.5cm; right: 1.5cm; bottom: 0.8cm; height: 1cm;
            }
        }

        body {
            font-family: Helvetica;
            color: #333333;
            font-size: 10pt;
        }

        /* Cabecera: logo a la izquierda, modelo y categoría a la derecha */
        .header-table {
            width: 100%;
            border-bottom: 2px solid $Color_Acento;
            padding-bottom: 8px;
            margin-bottom: 14px;
        }
        .logo-col { width: 45%; text-align: left; vertical-align: middle; }
        .title-col { width: 55%; text-align: right; vertical-align: middle; }

        h1 {
            color: $Color_Acento;
            font-size: 20pt;
            margin: 0 0 2px 0;
        }
        .nombre { font-size: 11pt; font-weight: bold; color: #1A1A1A; margin: 0; }
        .subtitle { font-size: 9.5pt; color: #666666; margin: 0; }

        .section-title {
            color: $Color_Acento;
            font-size: 13pt;
            font-weight: bold;
            border-bottom: 1px solid #E0E0E0;
            padding-bottom: 3px;
            margin-top: 12px;
            margin-bottom: 8px;
        }

        /* Imagen del producto y vista explosionada (bloque generado por el script) */
        .product-image-container, .caja {
            text-align: center;
            padding: 8px;
            border: 1px solid #E0E0E0;
            background-color: #FAFAFA;
        }
        .cap { text-align: center; font-size: 8pt; color: #757575; padding-top: 2px; }

        /* Tabla de especificaciones (generada por el script: table.specs) */
        table.specs { width: 100%; margin-top: 4px; margin-bottom: 8px; }
        table.specs th {
            background-color: $Color_Acento;
            color: #FFFFFF;
            font-weight: bold;
            text-align: left;
            padding: 6px 8px 4px 8px;
            font-size: 9pt;
            border: 1px solid $Color_Acento;
        }
        table.specs td {
            padding: 5px 8px 3px 8px;
            border: 0.5px solid #E0E0E0;
            font-size: 9pt;
            vertical-align: top;
        }
        table.specs tr.par td { background-color: #F6F6F6; }

        #pie {
            font-size: 8pt;
            color: #757575;
            border-top: 0.5px solid #E0E0E0;
            padding-top: 3px;
        }
    </style>
</head>
<body>

    <table class="header-table">
        <tr>
            <td class="logo-col">
                <img src="$Ruta_Logo" height="$Logo_H">
            </td>
            <td class="title-col">
                <h1>$Modelo</h1>
                <p class="nombre">$Nombre</p>
                <p class="subtitle">Categoría: <strong>$Categoria</strong></p>
            </td>
        </tr>
    </table>

    <div class="section-title">Vista del Producto</div>
    <div class="product-image-container">
        <img src="$Ruta_Foto" width="$Foto_W" height="$Foto_H">
    </div>

    <div class="section-title">Especificaciones Técnicas</div>
    $Tabla_Especificaciones

    $Bloque_Vista_Explosionada

    <div id="pie">
        <table width="100%"><tr>
            <td style="text-align: left;">Relant · Ficha técnica generada el $Fecha · $Modelo</td>
            <td style="text-align: right;">Página <pdf:pagenumber> de <pdf:pagecount></td>
        </tr></table>
    </div>

</body>
</html>
