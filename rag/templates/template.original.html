<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ficha Técnica - $Modelo</title>
    <style>
        /* Configuración de página exclusiva para xhtml2pdf */
        @page {
            size: letter;
            margin: 1.5cm;
            @bottom-right {
                content: "Página " counter(page) " de " counter(pages);
                font-family: 'Helvetica', 'Arial', sans-serif;
                font-size: 8pt;
                color: #757575;
            }
            @bottom-left {
                content: "Ficha Técnica Generada Automáticamente";
                font-family: 'Helvetica', 'Arial', sans-serif;
                font-size: 8pt;
                color: #757575;
            }
        }

        body {
            font-family: 'Helvetica', 'Arial', sans-serif;
            color: #333333;
            font-size: 10pt;
            line-height: 1.4;
        }

        /* Contenedores principales de la cabecera */
        .header-table {
            width: 100%;
            border-bottom: 2px solid $Color_Acento;
            padding-bottom: 12px;
            margin-bottom: 20px;
        }

        .logo-col {
            width: 50%;
            text-align: left;
            vertical-align: middle;
        }

        .title-col {
            width: 55%;
            text-align: right;
            vertical-align: middle;
        }

        /* Control e inyección del logo híbrido (Texto + Símbolo nativo) */
        .brand-text {
            font-family: 'Helvetica', 'Arial', sans-serif;
            font-size: 28pt;
            font-weight: bold;
            color: #1A1A1A;
        }

        .brand-symbol {
            font-family: 'Helvetica', 'Arial', sans-serif;
            font-size: 28pt;
            font-weight: bold;
            color: #E51A24;
        }

        h1 {
            color: $Color_Acento;
            font-size: 22pt;
            margin: 0 0 5px 0;
            text-transform: uppercase;
        }

        .subtitle {
            font-size: 11pt;
            color: #666666;
            margin: 0;
        }

        /* Sección de Imagen del Producto */
        .product-image-container {
            text-align: center;
            margin-bottom: 25px;
            padding: 10px;
            border: 1px solid #E0E0E0;
            background-color: #FAFAFA;
        }

        .product-img {
            max-height: 250px;
            max-width: 100%;
        }

        .section-title {
            color: $Color_Acento;
            font-size: 14pt;
            border-bottom: 1px solid #E0E0E0;
            padding-bottom: 5px;
            margin-top: 20px;
            margin-bottom: 12px;
            font-weight: bold;
        }

        /* Estilos para la tabla dinámica generada por el script */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            margin-bottom: 20px;
        }

        th {
            background-color: $Color_Acento;
            color: #FFFFFF;
            font-weight: bold;
            text-align: left;
            padding: 8px;
            font-size: 9pt;
            border: 1px solid $Color_Acento;
        }

        td {
            padding: 7px 8px;
            border-bottom: 1px solid #E0E0E0;
            border-left: 1px solid #E0E0E0;
            border-right: 1px solid #E0E0E0;
            font-size: 9pt;
            vertical-align: middle;
        }

        tr {
            background-color: #FFFFFF;
        }

    </style>
</head>
<body>

    <!-- Cabecera con diseño nativo de seguridad anti-desaparición -->
    <table class="header-table">
        <tr>
            <td class="logo-col" style="border: none; padding: 0; vertical-align: middle;">
                <!-- Imagen corporativa real unificada que evita errores de carga dinámicos -->
                <img src="$Ruta_Logo" class="logo-img" alt="Relant Industrial Logo" style="height: 45px; width: auto; display: block; border: none;">
            </td>
            <td class="title-col" style="border: none; padding: 0;">
                <h1>$Modelo</h1>
                <p class="subtitle">Categoría: <strong>$Categoria</strong></p>
            </td>
        </tr>
    </table>

    <!-- Vista e Imagen del Producto -->
    <div class="section-title">Vista del Producto</div>
    <div class="product-image-container">
        <img src="$Ruta_Foto" class="product-img" alt="Fotografía del Producto">
    </div>

    <!-- Tabla de Especificaciones Técnicas (Inyectada dinámicamente) -->
    <div class="section-title">Especificaciones Técnicas y Variantes</div>
    $Tabla_Especificaciones
    <div class="product-image-container">
        <img src="$Ruta_Vista_Explosionada" class="product-img" alt="Vista Explosión del Producto">
    </div>

</body>
</html>
